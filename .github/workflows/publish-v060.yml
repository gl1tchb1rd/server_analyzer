name: Publish Forensic Server Analyzer v0.6.0 source

on:
  push:
    branches: [main]
    paths:
      - "release/Forensic_Server_Analyzer_v0.6.0_Windows.zip"

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract verified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fsa060
          mkdir -p /tmp/fsa060
          unzip -q release/Forensic_Server_Analyzer_v0.6.0_Windows.zip -d /tmp/fsa060
          SRC="$(find /tmp/fsa060 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          test -f "$SRC/Forensic_Server_Analyzer.py"
          test -f "$SRC/_system/journal_native.py"

          rsync -a --delete             --exclude=".git/"             --exclude=".github/"             --exclude="release/"             "$SRC/" ./

      - name: Commit v0.6.0 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Publish Forensic Server Analyzer v0.6.0 source"
          git push
